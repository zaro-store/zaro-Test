name: zaro_app
description: ZARO gaming top-up mobile app
publish_to: 'none'
version: 1.0.1+2
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/zaro-logo.png
    - assets/images/
flutter_launcher_icons:
  android: true
  image_path: assets/zaro-logo.png
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: assets/zaro-logo.png
