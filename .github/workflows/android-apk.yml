name: Build ZARO Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: ZARO_Topup/android-app
        run: flutter create . --platforms=android --org com.zaro.store --project-name zaro_app
      - name: Get packages
        working-directory: ZARO_Topup/android-app
        run: flutter pub get
      - name: Generate ZARO launcher icon
        working-directory: ZARO_Topup/android-app
        run: dart run flutter_launcher_icons
      - name: Build release APK
        working-directory: ZARO_Topup/android-app
        run: flutter build apk --release
      - name: Prepare release metadata
        id: release
        working-directory: ZARO_Topup/android-app
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | tr -d "'")
          TAG="zaro-android-v${VERSION}"
          cp build/app/outputs/flutter-apk/app-release.apk zaro-android.apk
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish stable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.release.outputs.tag }}" \
              --title "ZARO Android ${{ steps.release.outputs.version }}" \
              --notes "Official ZARO Android application release."
          gh release upload "${{ steps.release.outputs.tag }}" \
            ZARO_Topup/android-app/zaro-android.apk --clobber
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZARO-Android-Release
          path: ZARO_Topup/android-app/zaro-android.apk
          if-no-files-found: error
          retention-days: 90
