name: Build ZARO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZARO_Topup/android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: ZARO_Topup/android-app
        run: flutter create . --platforms=android --org com.zaro.store --project-name zaro_app
      - name: Get packages
        working-directory: ZARO_Topup/android-app
        run: flutter pub get
      - name: Build release APK
        working-directory: ZARO_Topup/android-app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaro-android-apk
          path: ZARO_Topup/android-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
