name: Build ZARO Admin for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "ZARO_Topup/admin-desktop/**"
      - ".github/workflows/admin-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZARO_Topup/admin-desktop/package.json

      - name: Install dependencies
        working-directory: ZARO_Topup/admin-desktop
        run: npm install

      - name: Build Windows EXE
        working-directory: ZARO_Topup/admin-desktop
        run: npm run build:win

      - name: Upload ZARO Admin EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZARO-Admin-Windows
          path: ZARO_Topup/admin-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14